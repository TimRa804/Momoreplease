# This file is the "robot" (called GitHub Actions).
# Every time you push changes to the main branch, it publishes your site
# to GitHub Pages automatically. This idea is called CI/CD (DevOps basics).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you also run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
